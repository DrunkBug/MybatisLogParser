services:
  mybatis-log-parser:
    image: ${IMAGE_NAME:-ghcr.io/osake/mybatislogparser}:${IMAGE_TAG:-latest}
    container_name: mybatis-log-parser
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-3003}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
